name: Bug report
description: Klyth did something wrong or failed with an error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/TROUBLESHOOTING.md](https://github.com/Trosfy/claude-klyth/blob/main/docs/TROUBLESHOOTING.md) first; most `klyth:` lines are listed there.
        Never paste an API key, a key command's output, or a provider URL you want kept private.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: lines
    attributes:
      label: Klyth lines
      description: Relevant `klyth:` lines and `/klyth` output. Redact private values, but keep diagnostic wording. Do not paste a full debug log.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The relevant part of `klyth.json` (provider `kind`, model ids, alias), with keys and private URLs removed.
      render: json
  - type: input
    id: commit
    attributes:
      label: Klyth commit
      placeholder: git -C <your clone> rev-parse --short HEAD
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: claude --version
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: bun --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Linux]
    validations:
      required: true
